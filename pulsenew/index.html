<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --beat: 1.6s;   /* one cycle of the "Pulsing" wave and the Receive logo's swell, so they stay in step */
    --bg: #fafafa; --fg: #111; --muted: #737373; --line: #e4e4e4; --field: #fff; --soft: #f0f0f0; --bad: #b42318;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #ededed; --muted: #8f8f8f; --line: #2a2a2a; --field: #181818; --soft: #1e1e1e; --bad: #f97066; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px 56px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  h1 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  h1 .logo { width: 22px; height: 22px; }

  /* Receive: the logo is the listen button, and it beats while listening */
  .beat { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; padding: 12px 0 4px; font: inherit; font-size: 15px; font-weight: 500; color: var(--fg); background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .beat img { width: 132px; height: 132px; border-radius: 50%; transition: transform .15s; }
  .beat:hover img { transform: scale(1.03); }
  .beat:focus-visible img { outline: 2px solid var(--fg); outline-offset: 4px; }
  /* one smooth swell per wave cycle; it peaks as the "Pulsing" wave crosses the middle of the word */
  .beat.on img { animation: heartbeat var(--beat) ease-in-out infinite; }
  @keyframes heartbeat {
    0%, 55%, 100% { transform: scale(1); }
    20% { transform: scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) { .beat.on img { animation: none; } }
  #net { font-size: 13px; color: var(--muted); }

  nav { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
  nav button { background: none; border: 0; padding: 0 0 10px; margin-bottom: -1px; font: inherit; font-weight: 500; color: var(--muted); border-bottom: 1.5px solid transparent; cursor: pointer; }
  nav button[aria-selected=true] { color: var(--fg); border-color: var(--fg); }

  section[hidden], [hidden] { display: none !important; }
  .field { margin-bottom: 20px; }
  .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  input[type=text] { width: 100%; padding: 11px 12px; font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
  input[type=text]:focus { outline: none; border-color: var(--fg); }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--field); }
  .seg button { flex: 1; padding: 9px 4px; font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; border-left: 1px solid var(--line); cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed=true] { color: var(--fg); background: var(--soft); font-weight: 500; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin: 4px 0 20px; }
  .check input { accent-color: var(--fg); width: 16px; height: 16px; margin: 0; }

  .primary { width: 100%; padding: 13px; font: inherit; font-weight: 500; color: var(--bg); background: var(--fg); border: 1px solid var(--fg); border-radius: 8px; cursor: pointer; }
  .primary.on { color: var(--fg); background: transparent; }
  .primary:disabled { opacity: .4; cursor: default; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 19px; font-variant-numeric: tabular-nums; }
  .meta.err, .status.err { color: var(--bad); }

  canvas { display: block; width: 100%; margin-top: 20px; border-radius: 6px; background: var(--soft); }

  select { width: 100%; padding: 10px 12px; font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips button { padding: 5px 10px; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  .chips button:hover { color: var(--fg); border-color: var(--fg); }
  button.link { margin-top: 6px; padding: 0; font: inherit; font-size: 13px; color: var(--fg); background: none; border: 0; text-decoration: underline; cursor: pointer; }
  select:focus { outline: none; border-color: var(--fg); }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .qrbig { width: 100%; max-width: 420px; aspect-ratio: 1; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .qrbig svg { display: block; width: 100%; height: 100%; }
  .qrlink { font-size: 14px; text-align: center; word-break: break-all; }
  .qrnow { font-size: 13px; color: var(--muted); min-height: 19px; font-variant-numeric: tabular-nums; }
  .stage.full { position: fixed; inset: 0; z-index: 10; justify-content: center; padding: 3vmin; background: #fff; color: #111; cursor: zoom-out; }
  .stage.full .qrbig { max-width: none; width: min(86vw, 80vh); border: 0; padding: 0; }
  .stage.full .qrlink { font-size: clamp(16px, 2.6vmin, 30px); color: #111; }
  .stage.full .qrnow { font-size: clamp(13px, 1.8vmin, 20px); color: #737373; }
  .row .primary.on { color: var(--fg); }

  .status { margin-top: 16px; font-size: 14px; }
  .bar { height: 2px; background: var(--line); margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .1s; }

  .result { margin-top: 24px; padding: 16px; border: 1px solid var(--fg); border-radius: 8px; }
  .result .url { font-size: 14px; word-break: break-all; }
  .result a { display: inline-block; margin-top: 12px; font-weight: 500; color: var(--fg); }

  h2 { margin: 32px 0 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  ul.list { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  ul.list li { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  ul.list li > :first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
  ul.list button { padding: 0; font: inherit; font-size: 13px; color: var(--fg); background: none; border: 0; text-decoration: underline; cursor: pointer; }
  ul.list button:disabled { color: var(--muted); text-decoration: none; cursor: default; }
  ul.list button.quiet { color: var(--muted); }

  .meter { margin-top: 10px; }
  .meter .bar { height: 4px; margin-top: 0; border-radius: 2px; overflow: hidden; }
  .check-num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }

  /* Send tab settings, below the play button and sound chart */
  h2.settings { margin: 36px 0 20px; padding-bottom: 10px; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); }
  .checks { display: flex; flex-direction: column; gap: 12px; }
  .checks .check { margin: 0; }

  /* "Pulsing. Click to stop.": a wave of emphasis runs from the P of Pulsing to the p of stop */
  .wave span { display: inline-block; white-space: pre; animation: wave var(--beat) ease-in-out infinite; animation-delay: calc(var(--i) * 0.045s); }
  @keyframes wave {
    0%, 40%, 100% { opacity: .55; transform: none; }
    12% { opacity: 1; transform: translateY(-2px) scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) { .wave span { animation: none; opacity: 1; } }

  .nudge { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); animation: rise .25s ease-out; }
  .nudge #nudgeSlow { padding: 0; font: inherit; color: var(--fg); background: none; border: 0; text-decoration: underline; cursor: pointer; }
  .nudge .x { padding: 0 2px; font: inherit; font-size: 18px; line-height: 1; color: var(--muted); background: none; border: 0; cursor: pointer; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  /* recent list: a bin appears on hover (always shown on touch screens) */
  ul.list button.bin { display: flex; padding: 2px; color: var(--muted); text-decoration: none; opacity: 0; transition: opacity .15s; }
  ul.list li:hover button.bin, ul.list button.bin:focus-visible { opacity: 1; }
  ul.list button.bin:hover { color: var(--bad); }
  @media (hover: none) { ul.list button.bin { opacity: 1; } }
</style>
</head>
<body>
<main>
  <header>
    <h1><img class="logo" src="icon.svg" alt="">Pulse</h1>
    <span id="net" hidden>Offline</span>
  </header>

  <nav role="tablist">
    <button id="tab-send" role="tab" aria-selected="true">Send</button>
    <button id="tab-recv" role="tab" aria-selected="false">Receive</button>
    <button id="tab-qr" role="tab" aria-selected="false">QR</button>
  </nav>

  <section id="send">
    <div class="field">
      <label class="label" for="url">Link</label>
      <input id="url" type="text" value="" placeholder="Paste a link" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
      <div class="hint" id="linkHint"></div>
    </div>
    <div class="field" id="modeField">
      <span class="label">Sound</span>
      <div class="seg" id="mode"></div>
      <div class="hint" id="modeHint"></div>
    </div>
    <button id="play" class="primary">Play</button>
    <div id="nudge" class="nudge" role="status" hidden>
      <span>Not receiving the pulse? Try <button id="nudgeSlow" type="button">slow</button> mode.</span>
      <button id="nudgeClose" class="x" type="button" aria-label="Dismiss">×</button>
    </div>
    <div id="sendMeta" class="meta"></div>
    <canvas id="score" data-h="140"></canvas>

    <h2 class="settings">Settings</h2>
    <div class="field">
      <span class="label">Music</span>
      <div class="seg" id="music"></div>
      <div class="hint" id="musicHint"></div>
      <button id="another" class="link" type="button" hidden>Another piece</button>
    </div>
    <div class="checks">
      <label class="check"><input id="slow" type="checkbox"> Slower pulse (tick if struggling to receive)</label>
      <label class="check"><input id="three" type="checkbox"> Limit pulse to 3 repeats</label>
      <label class="check"><input id="shorten" type="checkbox" checked> Shorten long links (needs internet)</label>
    </div>
  </section>

  <section id="qrtab" hidden>
    <div id="stage" class="stage" title="Tap to leave full screen">
      <div id="qrBig" class="qrbig"></div>
      <div id="qrLink" class="qrlink"></div>
      <div id="qrNow" class="qrnow"></div>
    </div>
    <p id="qrEmpty" class="hint" hidden></p>
    <div class="row" style="margin-top:20px">
      <button id="project" class="primary">Full screen</button>
      <button id="play2" class="primary on">Play sound</button>
    </div>
    <div class="hint">Full screen for a projector. The sound keeps playing.</div>
  </section>

  <section id="recv" hidden>
    <button id="listen" class="beat" type="button" aria-pressed="false">
      <img src="icon.svg" alt="">
      <span id="listenLabel">Click to pulse</span>
    </button>
    <div class="meter"><div class="bar"><i id="meterBar"></i></div><div id="meterText" class="hint"></div></div>
    <div id="status" class="status">Microphone off</div>
    <div class="bar"><i id="prog"></i></div>
    <label class="check" style="margin-top:16px"><input id="auto" type="checkbox" checked> Open links automatically in a new tab</label>
    <div id="result" class="result" hidden>
      <div id="resUrl" class="url"></div>
      <div id="resMelody" class="hint"></div>
      <a id="resOpen" target="_blank" rel="noopener noreferrer">Open</a>
    </div>
    <div id="pending" hidden>
      <h2 id="pendingTitle"></h2>
      <ul id="pendingList" class="list"></ul>
    </div>
    <div id="recent" hidden>
      <h2>Recent</h2>
      <ul id="history" class="list"></ul>
    </div>
  </section>
</main>

<script src="vendor/qrcode.js"></script>
<script src="pulse.js"></script>
<script src="app.js"></script>
</body>
</html>
