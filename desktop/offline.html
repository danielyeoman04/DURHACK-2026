<!doctype html>
<meta charset="utf-8">
<title>Pulse</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #e8e8ea; font: 16px system-ui, sans-serif; text-align: center; }
  button { margin-top: 16px; font: inherit; padding: 8px 20px; border-radius: 8px; border: 0; cursor: pointer; }
</style>
<div>
  <h1>Pulse can't load</h1>
  <p>Connect to the internet once so Pulse can save itself. After that it works offline.</p>
  <button id="r">Try again</button>
</div>
<script>document.getElementById('r').onclick = () => window.pulseDesktop && window.pulseDesktop.retry();</script>
